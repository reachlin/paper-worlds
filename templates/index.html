<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Place</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfc0a0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font: italic 14px/1.3 Georgia, 'Times New Roman', serif;
          color: #fff6e4; opacity: .85; letter-spacing: .03em; pointer-events: none; text-shadow: 0 1px 3px #4a3620; }
  .credit { position: fixed; right: 8px; bottom: 4px; font: 10px/1.2 Georgia, serif; color: #fff6e4; opacity: .5;
            pointer-events: none; text-shadow: 0 1px 2px #4a3620; }
</style>
<!-- "papercraft/" points at the folder that holds lib/ -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "papercraft/": "./papercraft/" } }</script>
</head>
<body>
<div class="hint" id="hint">walk with WASD/arrows · drag to look · scroll to zoom · Tab for the chart · double-click the chart to travel</div>
<div class="credit">Map data © OpenStreetMap contributors (ODbL)</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
